<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Image Frame logo: a picture frame around a picture on a
       transparency checkerboard. Original drawing. -->
  <defs>
    <pattern id="checker" x="72" y="72" width="92" height="92" patternUnits="userSpaceOnUse">
      <rect width="92" height="92" fill="#fcfcfc"/>
      <rect width="46" height="46" fill="#bdc3c7"/>
      <rect x="46" y="46" width="46" height="46" fill="#bdc3c7"/>
    </pattern>
    <clipPath id="inner">
      <rect x="72" y="72" width="368" height="368" rx="16"/>
    </clipPath>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="56" fill="#f67400"/>
  <rect x="72" y="72" width="368" height="368" rx="16" fill="url(#checker)"/>
  <g clip-path="url(#inner)">
    <circle cx="340" cy="172" r="46" fill="#fdbc4b"/>
    <path d="M72 440 L196 252 L276 360 L330 296 L440 424 V440 Z" fill="#3daee9"/>
  </g>
</svg>
